[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialect-id"
version = "0.1.0"
description = "Reusable training, evaluation, calibration, and large-scale labeling tools for Arabic dialect identification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [{name = "Lounes Benali"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "numpy>=1.26,<3",
  "pyarrow>=15",
  "safetensors>=0.4",
  "soundfile>=0.12",
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.45,<6",
]

[project.optional-dependencies]
compression = ["zstandard>=0.22"]
dev = ["pytest>=8", "ruff>=0.6"]
qwen = ["qwen-asr==0.0.6"]

[project.scripts]
dialect-id-train = "dialect_id.train:main"
dialect-id-evaluate = "dialect_id.evaluate:main"
dialect-id-predict = "dialect_id.predict:main"

[tool.setuptools]
packages = [
  "dialect_id",
  "tools",
  "tools.big_run",
  "tools.calibration",
  "tools.evaluation",
]

[tool.setuptools.package-dir]
"" = "src"
tools = "tools"
"tools.big_run" = "tools/big_run"
"tools.calibration" = "tools/calibration"
"tools.evaluation" = "tools/evaluation"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
